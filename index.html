<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Elis Ballymount has moved</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d2b2b;padding:16px;box-sizing:border-box}
  .card{max-width:440px;width:100%;background:#fff;border-radius:14px;padding:28px 24px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
  h1{font-size:1.35rem;margin:0 0 10px;color:#0b8b8c}
  p{margin:0 0 16px;line-height:1.5}
  .url{font-weight:700;word-break:break-all}
  a.button{display:inline-block;padding:13px 22px;border-radius:9px;background:#078c8d;color:#fff;text-decoration:none;font-weight:700}
  small{display:block;margin-top:16px;color:#5b6b6b}
</style>
</head>
<body>
<main class="card">
  <h1>Elis Ballymount has moved</h1>
  <p>The system now has a new address:</p>
  <p class="url">elis-ballymount.pages.dev</p>
  <p><a class="button" id="go" href="https://elis-ballymount.pages.dev/">Open the new address</a></p>
  <p>Please update your bookmark. If you installed the app on your phone, delete the old icon and install it again from the new address.</p>
  <small id="note">Taking you there in a few seconds…</small>
</main>
<script>
  (function () {
    // Keep the page the person was trying to open (old links, bookmarks, email links).
    var path = window.location.pathname.replace(/^\/(ElisCaretex|ElisBallymount)(?=\/|$)/i, "") || "/";
    if (path === "/404.html") path = "/";
    var target = "https://elis-ballymount.pages.dev" + path + window.location.search + window.location.hash;
    document.getElementById("go").href = target;
    setTimeout(function () { window.location.replace(target); }, 4000);
  })();
</script>
</body>
</html>
